<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>完形填空 · 一页式全景批注讲义</title>
<style>
:root{
  --frame-1:#f0dfc2; --frame-2:#fbf5e8;
  --banner-bg:#f7ebd7; --banner-edge:#e0995c;
  --ink:#33231a; --ans:#d0492b; --gloss:#8c6239; --punch:#b03024;
  --mark:#f8dc94; --tick:#2f7d3a; --th:#f3ddc0; --rule:#e2d3b6;
  --fscale:1; --body-fs:calc(15.5px*var(--fscale)); --body-lh:2.5; --side-fs:calc(12px*var(--fscale)); --small-fs:calc(11.5px*var(--fscale));
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:linear-gradient(135deg,var(--frame-1),var(--frame-2));
  padding:22px 12px 40px;
  font-family:"SimSun","Songti SC","Noto Serif CJK SC",serif;
  color:var(--ink);
}
.page{
  max-width:1080px;margin:0 auto;background:#fbf6ea;border-radius:12px;
  box-shadow:0 0 0 8px rgba(255,252,245,.9),0 10px 30px rgba(140,90,40,.18);
  padding:26px 34px 22px;position:relative;overflow:hidden;
}
.page::before{
  content:"";position:absolute;left:0;top:0;width:100%;height:8px;
  background:linear-gradient(90deg,#b03024,#e2703a,#e9a13b);
}
.page::after{
  content:"";position:absolute;left:0;bottom:0;width:100%;height:8px;
  background:linear-gradient(90deg,#e9a13b,#e2703a,#b03024);
}
.tip{
  max-width:1080px;margin:0 auto 10px;text-align:right;
}
.pdfbtn{
  font:13px/1 "Microsoft YaHei",sans-serif;color:#fff;background:#d0492b;
  border:none;border-radius:6px;padding:9px 16px;cursor:pointer;
  box-shadow:0 2px 6px rgba(160,50,20,.25);
}
.pdfbtn:hover{background:#b03024}
.pdfbtn.ghost{background:#8c6239}
.pdfbtn.ghost:hover{background:#6e4a28}
.fsbtn{padding:9px 12px;font-weight:700;letter-spacing:1px}
.banner{
  background:var(--banner-bg);
  border-left:3px solid var(--banner-edge);border-right:3px solid var(--banner-edge);
  padding:8px 12px;font-size:calc(12px*var(--fscale));line-height:1.55;color:#5a3a1e;margin-bottom:10px;
}
.banner .chain{color:#b03024;font-weight:700}
.head{position:relative;text-align:center;margin:2px 0 16px;min-height:40px}
.head h1{
  margin:0;font:700 calc(30px*var(--fscale))/1.25 "Noto Serif SC","Songti SC","SimSun",serif;
  letter-spacing:5px;color:#2b1a10;
}
.head .pt{
  position:absolute;right:0;bottom:2px;
  font:calc(15px*var(--fscale))/1.2 Georgia,"Times New Roman",serif;color:var(--ans);
}
.cols{display:grid;grid-template-columns:38% 1fr}
aside{border-right:1px solid #e6d7bb;padding-right:14px;font-size:var(--side-fs);line-height:1.55}
main{padding-left:17px}
.sect{padding-bottom:7px;margin-bottom:7px;border-bottom:1px dashed var(--rule)}
.sect:last-child{border-bottom:0;margin-bottom:0}
.sect h3{margin:0 0 4px;font-size:calc(12.5px*var(--fscale));font-weight:700;letter-spacing:.3px;color:#4a2c15}
.sect .body{white-space:normal}
.sect .punch{display:block;margin-top:5px;color:var(--punch)}
main p{
  margin:0 0 4px;font:var(--body-fs)/var(--body-lh) Georgia,"Times New Roman",serif;
  text-align:justify;color:var(--ink);text-indent:2em;
}
.b{
  position:relative;display:inline-block;min-width:84px;height:1em;
  border-bottom:1.2px solid #3a2a1e;vertical-align:baseline;
}
.b .a{
  position:absolute;left:0;bottom:calc(100% + 2px);
  font:calc(10px*var(--fscale))/1.1 Georgia,"Times New Roman",serif;color:var(--ans);white-space:nowrap;
}
.b .z{
  position:absolute;left:0;top:calc(100% + 2px);
  font:calc(10px*var(--fscale))/1.1 "SimSun",serif;color:var(--gloss);white-space:nowrap;
}
.hl{background:var(--mark);padding:0 1px}
.note{color:var(--punch);font-size:calc(10.5px*var(--fscale));font-family:"SimSun",serif}
.sheet-table{width:calc(100% - 26px);border-collapse:collapse;font-size:var(--small-fs);line-height:1.5;margin:2px 0 0 26px}
.sheet-table caption{
  caption-side:top;text-align:left;font-weight:700;font-size:calc(13.5px*var(--fscale));
  padding:8px 0 6px;color:#2b1a10;
}
.sheet-table th{background:var(--th);font-weight:700;text-align:left;padding:5px 8px;border-bottom:1px solid #ddc49e}
.sheet-table td{padding:4px 8px;border-bottom:1px solid #f0e6d2;vertical-align:middle}
.sheet-table th:first-child,.sheet-table td:first-child{width:5%;text-align:center;color:#444}
.sheet-table th:not(:first-child),.sheet-table td:not(:first-child){width:23.75%}
.opt-en{font-family:Georgia,"Times New Roman",serif}
.opt-zh{color:#6b5a48;font-size:.9em;margin-left:3px;font-family:"SimSun",serif}
.tick,.win .opt-en{color:var(--tick);font-weight:700}
.tick{font-family:"Segoe Print","Bradley Hand",cursive;margin-right:3px}
.win .opt-zh{color:var(--tick)}
.review{margin-top:10px;font-size:var(--small-fs);line-height:1.55}
.review p{margin:0 0 2px;text-align:justify}
.review .lab{font-weight:700;color:#b03024}
.recall .rn{color:var(--ans);font-weight:700}
.review .sen{display:block;margin:2px 0 0;text-align:justify}
.review .sno{color:var(--ans);font-weight:700;margin-right:2px}
.review .sen-en{font-family:Georgia,"Times New Roman",serif;font-style:italic;color:#33231a}
.review .swhy{color:#8c6239;font-size:calc(10.5px*var(--fscale));font-family:"SimSun",serif;margin-left:4px;font-style:normal}
.sep{color:#b09a78;margin:0 3px}
.pn{color:var(--ans);font-weight:700;font-family:"SimSun",serif;margin-right:2px}
.plot{margin:12px 0 2px;border-top:1px dashed var(--rule);padding-top:8px}.plot h3{margin:0 0 2px;font-size:calc(13px*var(--fscale));font-weight:700;color:#4a2c15;letter-spacing:.3px}
.plot svg{display:block;width:100%;height:auto}
.translation{margin:12px 0 2px;border-top:1px dashed var(--rule);padding-top:8px}
.translation h3{margin:0 0 4px;font-size:calc(13px*var(--fscale));font-weight:700;color:#4a2c15;letter-spacing:.3px}
.translation p{margin:0 0 4px;font:calc(12.5px*var(--fscale))/1.7 "SimSun",serif;color:#5a3a1e;text-align:justify;text-indent:2em}
.plot .plotnote{margin:2px 0 0;font-size:calc(11.5px*var(--fscale));line-height:1.5;color:#8c6239;font-family:"SimSun",serif}
.vocab{margin-top:8px;padding-top:6px;border-top:1px dashed var(--rule)}
.vocab h3{margin:0 0 4px;font-size:calc(12.5px*var(--fscale));font-weight:700;color:#4a2c15;letter-spacing:.3px}
.vocab ul{margin:0;padding:0;list-style:none}
.vocab li{padding:2px 0;border-bottom:1px dotted #e6d7bb;font-size:calc(11.5px*var(--fscale));line-height:1.45}
.vocab li:last-child{border-bottom:0}
.vocab .en{font-family:Georgia,"Times New Roman",serif;font-weight:700;color:#33231a}
.vocab .zh{color:#8c6239;margin-left:4px;font-family:"SimSun",serif}
#warn{
  display:none;max-width:1080px;margin:0 auto 10px;padding:7px 12px;
  background:#fff4e5;border:1px solid #e8b96a;color:#8a5a12;
  font:12px/1.5 "Microsoft YaHei",sans-serif;border-radius:6px;
}
@page{size:A4 portrait;margin:0}
@media print{
  body{background:#fbf6ea;padding:0}
  .tip,#warn{display:none!important}
  /* 版式按 1080px 宽设计；打印时整体缩到 A4 一页，不靠"适应页面"手工缩放 */
  .page{
    width:1080px;max-width:none;box-shadow:none;border-radius:0;
    padding:26px 34px 22px;zoom:0.64;
  }
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  tr,.b,.sect,.review p,.sheet-table caption{break-inside:avoid;page-break-inside:avoid}
}
</style>
</head>

<script>
(function(){
  var warn = document.getElementById('warn');
  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function put(id, html){ document.getElementById(id).innerHTML = html; }

  var raw = document.getElementById('sheet-data').textContent.trim();
  var d;
  try { d = JSON.parse(raw); }
  catch(e){
    warn.style.display = 'block';
    warn.textContent = '尚未注入数据。请先运行：python scripts/build_sheet.py INPUT.json OUTPUT.html';
    return;
  }

  // 区带 A · 顶部横幅
  var b = d.banner || {};
  var chain = (b.chain || []).join(' → ');
  put('banner',
    '【' + esc(b.genre) + '】' + esc(b.synopsis) +
    ' <span class="chain">主线＝' + esc(chain) + '</span>；' + esc(b.focus));

  // 区带 B · 标题
  put('title', esc(d.title || '完形填空'));
  put('ptitle', esc(d.passage_title || ''));

  // 区带 C · 左栏 P1–P5
  put('sections', (d.sections || []).map(function(s){
    return '<div class="sect"><h3>' + esc(s.id) + ' ' + esc(s.name) + '</h3>' +
           '<div class="body">' + esc(s.body).replace(/\n/g,'<br>') + '</div>' +
           '<span class="punch">' + esc(s.punch) + '</span></div>';
  }).join(''));

  // 区带 C2 · 左栏高价值词汇
  if ((d.vocab || []).length){
    document.getElementById('sections').insertAdjacentHTML('beforeend',
      '<div class="vocab"><h3>高价值词汇</h3><ul>' +
      d.vocab.map(function(w){
        return '<li><span class="en">' + esc(w.en) + '</span><span class="zh">' + esc(w.zh) + '</span></li>';
      }).join('') + '</ul></div>');
  }

  // 区带 D · 正文三层批注（每段前加①②③段标）
  var PNOS = ['①','②','③','④','⑤','⑥','⑦','⑧'];
  put('passage', (d.passage || []).map(function(para, pi){
    return '<p><span class="pn">' + (PNOS[pi] || '') + '</span>' + para.map(function(f){
      switch(f.t){
        case 'b':
          return '<span class="b"><span class="a">' + esc(f.no) + ' ' + esc(f.a) + '</span>' +
                 '<span class="z">' + esc(f.zh) + '</span></span>';
        case 'hl':   return '<span class="hl">' + esc(f.v) + '</span>';
        case 'note': return '<span class="note">（' + esc(f.v) + '）</span>';
        case 'br':   return '<br>';
        default:     return esc(f.v);
      }
    }).join('') + '</p>';
  }).join(''));

  // 区带 D1 · 全文翻译（按钮切换，默认隐藏）
  var tr = d.translation || [];
  if (tr.length){
    put('translation', '<h3>全文翻译</h3>' + tr.map(function(t, i){
      return '<p><span class="pn">' + (PNOS[i] || '') + '</span>' + esc(t) + '</p>';
    }).join(''));
    var tbtn = document.getElementById('transbtn');
    tbtn.style.display = 'inline-block';
    tbtn.addEventListener('click', function(){
      var el = document.getElementById('translation');
      var show = el.style.display === 'none';
      el.style.display = show ? 'block' : 'none';
      tbtn.textContent = show ? '隐藏翻译' : '全文翻译';
    });
  }

  // 区带 D2 · 故事山 · 情感线 · 故事线
  var plot = d.plot || {};
  var st = plot.stages || [];
  if (st.length){
    var n = st.length, W = 1010, H = 212, x0 = 80, x1 = W - 80;
    var sy = [150, 128, 95, 60, 100].slice(0, n);   // 故事山：起→承→转→高潮→收束
    var ey = [70, 118, 92, 52, 60].slice(0, n);     // 情感线：低开高走
    var X = [], gi;
    for (gi = 0; gi < n; gi++) X.push(x0 + gi * (x1 - x0) / (n - 1));
    var s = '<polyline points="' + X.map(function(x, j){ return x + ',' + sy[j]; }).join(' ') +
            '" fill="none" stroke="#d0492b" stroke-width="2"/>' +
            '<polyline points="' + X.map(function(x, j){ return x + ',' + ey[j]; }).join(' ') +
            '" fill="none" stroke="#c77d1e" stroke-width="1.5" stroke-dasharray="5 4"/>';
    for (gi = 0; gi < n; gi++){
      s += '<circle cx="' + X[gi] + '" cy="' + sy[gi] + '" r="4" fill="#d0492b"/>' +
           '<circle cx="' + X[gi] + '" cy="' + ey[gi] + '" r="3.5" fill="#c77d1e"/>' +
           '<text x="' + X[gi] + '" y="' + (sy[gi] + 16) + '" text-anchor="middle" font-size="11" fill="#5a3a1e">' + esc(st[gi].story) + '</text>' +
           '<text x="' + X[gi] + '" y="' + (ey[gi] - 8) + '" text-anchor="middle" font-size="11" fill="#a06a14">' + esc(st[gi].emotion) + '</text>' +
           '<text x="' + X[gi] + '" y="' + (H - 8) + '" text-anchor="middle" font-size="12" font-weight="700" fill="#b03024">' + esc(st[gi].no + ' ' + st[gi].stage) + '</text>';
    }
    s += '<text x="16" y="18" font-size="11" fill="#d0492b">—— 故事线（情节山）</text>' +
         '<text x="150" y="18" font-size="11" fill="#c77d1e">┄ 情感线</text>';
    put('plot', '<h3>故事山 · 情感线 · 故事线</h3>' +
      '<svg viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg" role="img">' + s + '</svg>' +
      (plot.line_emotion ? '<p class="plotnote">' + esc(plot.line_emotion) + '</p>' : ''));
  }

  // 区带 E · 选项与判断表
  var opts = d.options || [];
  var range = d.range || [opts.length ? opts[0].no : '', opts.length ? opts[opts.length-1].no : ''];
  var head = '<caption>选项与判断（' + esc(range[0]) + '–' + esc(range[1]) +
             '，<span class="tick">✓</span> 为答案）</caption>' +
             '<thead><tr><th>题</th><th>A</th><th>B</th><th>C</th><th>D</th></tr></thead>';
  var rows = opts.map(function(o){
    var cells = ['A','B','C','D'].map(function(k){
      var pair = o[k] || ['',''];
      var win = (o.key === k);
      return '<td' + (win ? ' class="win"' : '') + '>' +
             (win ? '<span class="tick">✓</span>' : '') +
             '<span class="opt-en">' + esc(pair[0]) + '</span>' +
             '<span class="opt-zh">' + esc(pair[1]) + '</span></td>';
    }).join('');
    return '<tr><td>' + esc(o.no) + '</td>' + cells + '</tr>';
  }).join('');
  put('opttable', head + '<tbody>' + rows + '</tbody>');

  // 区带 F · 复盘 + 续写佳句（每句配一个仿写）
  var r = d.review || {};
  var s2 = d.sentences || {};
  var good = (s2.good || []).map(function(x, i){
    return '<span class="sen"><span class="sno">' + (PNOS[i] || '') + '</span><span class="sen-en">' +
           esc(x.en) + '</span><span class="swhy">' + esc(x.note) + '</span></span>';
  }).join('');
  var imits = (s2.good || []).map(function(x, i){
    return (x.imitate ? '<span class="sen"><span class="sno">' + (PNOS[i] || '') +
           '</span><span class="sen-en">' + esc(x.imitate.en) +
           '</span><span class="swhy">' + esc(x.imitate.note) + '</span></span>' : '');
  }).join('');
  put('review',
    '<p><span class="lab">【总评】</span>' + esc(r.summary) + '</p>' +
    '<p><span class="lab">【方法】</span>' + esc(r.method) + '</p>' +
    '<p><span class="lab">【易错】</span>' + esc(r.pitfalls) + '</p>' +
    (good ? '<p><span class="lab">【续写佳句】</span>' + good + '</p>' : '') +
    (imits ? '<p><span class="lab">【仿写·读后续写】</span>' + imits + '</p>' : ''));

  // 区带 G · Word 导出（学生版 / 教师版）
  function passageHtml(tea){
    return (d.passage || []).map(function(para, pi){
      return '<p>' + (PNOS[pi] || '') + para.map(function(f){
        switch(f.t){
          case 'b':
            var u = '<u>&nbsp;&nbsp;&nbsp;' + esc(f.no) + '&nbsp;&nbsp;&nbsp;</u>';
            return tea ? u + '<span class="ans">（' + esc(f.a) + ' ' + esc(f.zh) + '）</span>' : u;
          case 'hl':
            return tea ? '<span class="hl">' + esc(f.v) + '</span>' : esc(f.v);
          case 'note':
            return tea ? '<span class="note">（' + esc(f.v) + '）</span>' : '（' + esc(f.v) + '）';
          case 'br':
            return '<br>';
          default:
            return esc(f.v);
        }
      }).join('') + '</p>';
    }).join('');
  }
  function optTableHtml(tea){
    var rows = (d.options || []).map(function(o){
      var cells = ['A','B','C','D'].map(function(k){
        var pair = o[k] || ['',''];
        var win = tea && o.key === k;
        return '<td' + (win ? ' style="color:#008000;font-weight:700"' : '') + '>' +
               (win ? '✓ ' : '') + esc(pair[0]) +
               (tea ? '<span style="color:#666;font-size:9pt"> ' + esc(pair[1]) + '</span>' : '') + '</td>';
      }).join('');
      return '<tr><td style="text-align:center">' + esc(o.no) + '</td>' + cells + '</tr>';
    }).join('');
    return '<table><tr><th style="width:6%">题</th>' +
           '<th style="width:23.5%">A</th><th style="width:23.5%">B</th><th style="width:23.5%">C</th><th style="width:23.5%">D</th></tr>' + rows + '</table>';
  }
  function headHtml(){
    return '<h1>' + esc(d.title || '完形填空') + '</h1>' +
           '<p style="text-indent:0;text-align:center"><i>' + esc(d.passage_title || '') + '</i></p>';
  }
  function studentBody(){
    return headHtml() + passageHtml(false) + '<h2>选项</h2>' + optTableHtml(false);
  }
  function teacherBody(){
    var b = d.banner || {};
    var h = headHtml() +
      '<p style="text-indent:0"><b>【' + esc(b.genre) + '】</b>' + esc(b.synopsis) +
      ' <span style="color:#c00000"><b>主线＝' + esc((b.chain || []).join('→')) + '</b></span>；' + esc(b.focus) + '</p>';
    h += passageHtml(true);
    h += '<h2>意义段解析</h2>';
    (d.sections || []).forEach(function(s){
      h += '<p style="text-indent:0"><b>' + esc(s.id) + ' ' + esc(s.name) + '</b>：' + esc(s.body) +
           '<span style="color:#c00000">　' + esc(s.punch) + '</span></p>';
    });
    h += '<h2>故事山 · 情感线</h2>';
    ((d.plot || {}).stages || []).forEach(function(s){
      h += '<p style="text-indent:0;margin:0 0 2pt">' + esc(s.no + ' ' + s.stage) + '：' + esc(s.story) + '（情感：' + esc(s.emotion) + '）</p>';
    });
    if (d.plot && d.plot.line_emotion) h += '<p style="text-indent:0;margin:0 0 2pt">' + esc(d.plot.line_emotion) + '</p>';
    h += '<h2>选项与判断</h2>' + optTableHtml(true);
    if ((d.vocab || []).length){
      h += '<h2>高价值词汇</h2><p style="text-indent:0">' + d.vocab.map(function(w){
        return '<b>' + esc(w.en) + '</b> ' + esc(w.zh);
      }).join('；') + '</p>';
    }
    var r = d.review || {};
    h += '<h2>复盘</h2>' +
      '<p style="text-indent:0"><b>【总评】</b>' + esc(r.summary) + '</p>' +
      '<p style="text-indent:0"><b>【方法】</b>' + esc(r.method) + '</p>' +
      '<p style="text-indent:0"><b>【易错】</b>' + esc(r.pitfalls) + '</p>';
    ((d.sentences || {}).good || []).forEach(function(x, i){
      h += '<p style="text-indent:0"><b>佳句' + (PNOS[i] || '') + '</b> <i>' + esc(x.en) + '</i>（' + esc(x.note) + '）</p>';
      if (x.imitate) h += '<p style="text-indent:0"><b>仿写' + (PNOS[i] || '') + '</b> <i>' + esc(x.imitate.en) + '</i>（' + esc(x.imitate.note) + '）</p>';
    });
    if ((d.translation || []).length){
      h += '<h2>全文翻译</h2>';
      d.translation.forEach(function(t, i){
        h += '<p>' + (PNOS[i] || '') + esc(t) + '</p>';
      });
    }
    return h;
  }
  function wordFile(body, name){
    var css = '@page WordSection1{size:595.3pt 841.9pt;margin:56.7pt 62pt}div.WordSection1{page:WordSection1}' +
      'body{font-family:"Times New Roman",SimSun,serif;font-size:12pt;color:#000}' +
      'p{line-height:1.5;text-align:justify;text-indent:2em;margin:0 0 6pt}' +
      'h1{font-size:15pt;text-align:center;margin:0 0 4pt}' +
      'h2{font-size:12pt;margin:10pt 0 4pt;border-bottom:1px solid #999;padding-bottom:2pt}' +
      'table{border-collapse:collapse;width:100%;margin:4pt 0 8pt}' +
      'td,th{border:1px solid #888;padding:3pt 5pt;font-size:10.5pt;text-align:left;vertical-align:middle}' +
      'th{background:#e8e8e8;font-weight:700;text-align:center}' +
      '.ans{color:#c00000;font-size:9pt}.note{color:#c00000;font-size:9pt}.hl{background:#fff3a8}';
    var html = '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word">' +
      '<head><meta charset="utf-8"><title>' + esc(name) + '</title><style>' + css + '</style></head>' +
      '<body><div class="WordSection1">' + body + '</div></body></html>';
    var blob = new Blob(['\ufeff' + html], { type: 'application/msword' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name + '.doc';
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 800);
  }
  var baseName = (d.title || '完形填空') + '_' + (d.passage_title || '') + '_';
  document.getElementById('wordstu').addEventListener('click', function(){
    wordFile(studentBody(), baseName + '学生版');
  });
  document.getElementById('wordtea').addEventListener('click', function(){
    wordFile(teacherBody(), baseName + '教师版');
  });
  window.__clozeExport = { studentBody: studentBody, teacherBody: teacherBody };

  // 字号调节：A－ / A＋（0.85–1.35，步进 0.05，localStorage 记忆）
  var FS_MIN = 0.85, FS_MAX = 1.35, FS_STEP = 0.05, FS_KEY = 'cloze-fscale';
  var fs = 1;
  try { fs = parseFloat(localStorage.getItem(FS_KEY)) || 1; } catch(e){}
  function applyFs(){
    fs = Math.min(FS_MAX, Math.max(FS_MIN, Math.round(fs / FS_STEP) * FS_STEP));
    document.documentElement.style.setProperty('--fscale', fs);
    try { localStorage.setItem(FS_KEY, fs); } catch(e){}
  }
  applyFs();
  document.getElementById('fsdown').addEventListener('click', function(){ fs -= FS_STEP; applyFs(); });
  document.getElementById('fsup').addEventListener('click', function(){ fs += FS_STEP; applyFs(); });

  // 一致性自检（仅屏幕提示，不打印）
  var msgs = [];
  var nos = opts.map(function(o){ return Number(o.no); });
  for (var i = 1; i < nos.length; i++){
    if (nos[i] !== nos[i-1] + 1) msgs.push('题号不连续：' + nos[i-1] + ' → ' + nos[i]);
  }
  var blanks = 0;
  (d.passage || []).forEach(function(p){ p.forEach(function(f){ if(f.t === 'b') blanks++; }); });
  if (blanks !== opts.length) msgs.push('正文空数 ' + blanks + ' 与选项表行数 ' + opts.length + ' 不一致');
  opts.forEach(function(o){
    if (!o.key) msgs.push('第 ' + o.no + ' 题缺答案（待核）');
    else if (['A','B','C','D'].indexOf(o.key) < 0) msgs.push('第 ' + o.no + ' 题答案标记非法');
  });
  if ((d.sections || []).length !== 5) msgs.push('左栏意义段不是 5 段');
  if ((d.plot || {}).stages && d.plot.stages.length && d.plot.stages.length !== (d.passage || []).length)
    msgs.push('故事山阶段数与正文段数不一致');
  if ((d.translation || []).length && d.translation.length !== (d.passage || []).length)
    msgs.push('全文翻译段数与正文段数不一致');
  if (msgs.length){
    warn.style.display = 'block';
    warn.innerHTML = '<b>数据自检提示</b><br>' + msgs.map(esc).join('<br>');
  }
})();
</script>
</body>
</html>
